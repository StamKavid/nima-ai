[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "hellenic-integrity"
version = "0.0.1"
description = "Engineering foundation for Greek public-record investigation tools"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []
classifiers = ["Private :: Do Not Upload"]

[dependency-groups]
dev = [
  "bandit>=1.8,<2",
  "hatchling==1.33.0",
  "mypy>=1.15,<2",
  "pip-audit>=2.9,<3",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/hellenic_integrity"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".agents"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PGH"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "scripts", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"

[tool.coverage.run]
branch = true
source = ["scripts"]

[tool.coverage.report]
fail_under = 90
show_missing = true
