[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "nima-ai"
version = "0.0.1"
description = "Evidence-backed company and public-spending investigation tools for Greece"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "defusedxml==0.7.1",
    "httpx==0.28.1",
    "jsonschema==4.26.0",
    "prefect==3.9.2",
    "psycopg[binary]==3.3.9",
]
classifiers = ["Private :: Do Not Upload"]

[dependency-groups]
dev = [
  "bandit>=1.8,<2",
  "cryptography==50.0.2",
  "hatchling==1.33.0",
  "mypy>=1.15,<2",
  "pip-audit>=2.9,<3",
  "playwright==1.65.1",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.11,<1",
  "types-defusedxml>=0.7.0.20260504",
  "types-jsonschema==4.26.0.20261006",
]

[tool.hatch.build.targets.wheel]
packages = ["src/nima"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".agents"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PGH"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "scripts", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"

[tool.coverage.run]
branch = true
source = ["scripts", "nima"]

[tool.coverage.report]
fail_under = 90
show_missing = true
