name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    if: github.event_name != 'push' || github.event.deleted != true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-bookworm@sha256:665dc7b37ac52a17e298511414c21d23ffa4e6a6ef6225b3e5d59c7afb35e994
        env:
          POSTGRES_DB: nima_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nima_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NIMA_TEST_DSN: host=127.0.0.1 port=5432 dbname=nima_test user=postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install checksum-pinned command runner
        run: |
          sh scripts/install-just.sh
          echo "$PWD/.tools/bin" >> "$GITHUB_PATH"
      - name: Install locked dependencies
        run: uv sync --frozen
      - name: Install checksum-pinned secret scanner
        run: just setup-security
      - name: Verify skills, lint, types, tests, build, and source security
        run: just check
      - name: Audit Python dependencies
        run: just audit
      - name: Upload coverage evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore
          retention-days: 7

  source-worker-egress:
    name: source-worker-egress
    if: github.event_name != 'push' || github.event.deleted != true
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked development dependencies
        run: uv sync --frozen
      - name: Check Linux amd64 and Docker data capacity
        run: |
          mkdir -p data/source-worker
          docker --host=unix:///var/run/docker.sock info --format '{"OSType":"{{.OSType}}","Architecture":"{{.Architecture}}"}' > data/source-worker/host.json
          task_docker_root=$(docker --host=unix:///var/run/docker.sock info --format '{{.DockerRootDir}}')
          task_free_bytes=$(df -PB1 "$task_docker_root" | awk 'NR == 2 {print $4}')
          uv run --frozen python -m nima.egress.preflight host --info-file data/source-worker/host.json --free-bytes "$task_free_bytes" > data/source-worker/host-receipt.json
      - name: Build pinned fixture toolbox
        run: >-
          docker --host=unix:///var/run/docker.sock build
          --secret id=ca_bundle,src=/etc/ssl/certs/ca-certificates.crt
          -t nima-egress-helper:local -f infra/source-worker/Dockerfile.helper .
      - name: Verify scoped helper privilege without network access
        run: >-
          docker --host=unix:///var/run/docker.sock run --rm --network none --read-only
          --user 0:0 --cap-drop ALL --cap-add NET_ADMIN --security-opt no-new-privileges
          --security-opt seccomp=infra/source-worker/seccomp.json
          --pids-limit 64 --memory 128m --cpus 1
          nima-egress-helper:local python -m nima.egress.preflight helper
          > data/source-worker/helper-receipt.json
      - name: Build pinned browser fixture image
        run: >-
          docker --host=unix:///var/run/docker.sock build
          --secret id=ca_bundle,src=/etc/ssl/certs/ca-certificates.crt
          -t nima-egress-worker:local -f infra/source-worker/Dockerfile.worker .
      - name: Verify actual Chromium sandbox without network access
        run: >-
          docker --host=unix:///var/run/docker.sock run --rm --network none --read-only
          --cap-drop ALL --security-opt no-new-privileges
          --security-opt seccomp=infra/source-worker/seccomp.json
          --shm-size 256m --pids-limit 256 --memory 2g --cpus 2
          --tmpfs /tmp:rw,noexec,nosuid,size=256m,mode=1777
          --tmpfs /home/nima:rw,nosuid,size=128m,uid=10001,gid=10001,mode=0700
          nima-egress-worker:local python -m nima.egress.preflight browser
          > data/source-worker/browser-receipt.json
      - name: Upload bounded prerequisite receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source-worker-prerequisites
          path: data/source-worker/*-receipt.json
          if-no-files-found: ignore
          retention-days: 7

  orchestration-compose:
    name: orchestration-compose
    if: github.event_name != 'push' || github.event.deleted != true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build hash-locked development image
        run: >-
          docker build --secret id=ca_bundle,src=/etc/ssl/certs/ca-certificates.crt
          -t nima-workflows:local -f infra/Dockerfile .
      - name: Start private local services and apply explicit migration
        run: |
          docker compose -p nima-ci -f infra/compose.orchestration.yml up -d --no-build --wait --wait-timeout 120
          docker compose -p nima-ci -f infra/compose.orchestration.yml exec -T app python -m nima db migrate
      - name: Verify installed module deployment and untouched source ledger
        run: |
          docker compose -p nima-ci -f infra/compose.orchestration.yml exec -T app python - <<'PY'
          import os
          import time
          from zoneinfo import ZoneInfo
          import httpx
          import psycopg

          assert os.getuid() == 10001
          ZoneInfo('Europe/Athens')
          url = os.environ['PREFECT_API_URL'] + '/deployments/name/nima-kimdis/local'
          with httpx.Client() as client:
              for attempt in range(60):
                  response = client.get(url)
                  if response.status_code == 200:
                      break
                  time.sleep(1)
              response.raise_for_status()
              deployment = response.json()
              assert deployment['entrypoint'] == 'nima.orchestration.flows.kimdis_flow'
              assert not deployment.get('schedules')
              for attempt in range(60):
                  response = client.get(os.environ['PREFECT_API_URL'] + '/deployments/name/nima-refresh/local')
                  if response.status_code == 200:
                      break
                  time.sleep(1)
              response.raise_for_status()
              assert response.json()['entrypoint'] == 'nima.orchestration.refresh_flow.refresh_flow'
              assert not response.json().get('schedules')
          with psycopg.connect(os.environ['NIMA_DATABASE_URL']) as connection:
              assert connection.execute('SELECT count(*) FROM nima.schema_migrations').fetchone() == (6,)
              assert connection.execute('SELECT count(*) FROM nima.workflow_requests').fetchone() == (0,)
              assert connection.execute('SELECT count(*) FROM nima.refresh_policies').fetchone() == (0,)
              assert connection.execute('SELECT count(*) FROM nima.observations').fetchone() == (0,)
          PY
      - name: Show service state
        if: always()
        run: docker compose -p nima-ci -f infra/compose.orchestration.yml ps -a
      - name: Stop disposable services
        if: always()
        run: docker compose -p nima-ci -f infra/compose.orchestration.yml down --volumes
