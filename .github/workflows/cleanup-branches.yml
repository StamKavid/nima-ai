name: Cleanup merged branches

on:
  pull_request_target:
    types: [closed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cleanup-merged-branches
  cancel-in-progress: false

jobs:
  cleanup:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: read
    steps:
      # Always use trusted default-branch code; never check out a PR head.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Delete only unchanged merged heads without open PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NIMA_CLEANUP_APPLY: '1'
        run: |
          gh auth setup-git --hostname github.com
          sh scripts/cleanup-merged-branches.sh
